<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada | Luis Dornellez</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--crema:#f5eee8;--cafe:#30241f;--cafe-2:#68483c;--oro:#ead0a7;--bronce:#8a5d24;--texto:#4d3f38;--radio:14px;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Lato',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:400 17px/1.7 var(--sans);background:var(--crema);color:var(--texto)}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--serif);color:var(--cafe);line-height:1.15;margin:0}
a{color:var(--bronce)}
:focus-visible{outline:3px solid var(--bronce);outline-offset:3px}
.skip{position:absolute;left:12px;top:-60px;z-index:20;background:var(--oro);color:var(--cafe);padding:10px 16px;border-radius:8px}
.skip:focus{top:12px}

/* Encabezado */
.cabecera{position:relative;background:var(--cafe);text-align:center;padding:96px 20px 0}
.cabecera h1{color:#fff;font-size:clamp(3rem,9vw,5.75rem);font-weight:600;letter-spacing:.01em}
.lema{max-width:30ch;margin:16px auto 40px;font-family:var(--serif);font-style:italic;font-size:clamp(1.35rem,3vw,1.85rem);line-height:1.4;color:var(--oro)}
.hero{width:100%;max-width:1200px;height:clamp(260px,48vw,520px);margin:0 auto;object-fit:cover;object-position:center;border-radius:var(--radio) var(--radio) 0 0}

/* Reproductor */
.player{position:absolute;top:16px;right:16px;z-index:5;display:flex;align-items:center;gap:10px;width:250px;padding:8px 16px 8px 8px;text-align:left;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.player[hidden]{display:none}
.player button{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--oro);color:var(--cafe);font-size:15px;cursor:pointer;transition:background .25s}
.player button:hover{background:#f4e3c6}
.player-info{flex:1;min-width:0}
.player-titulo{font-size:13px;font-weight:700;line-height:1.3;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra{position:relative;display:flex;align-items:center;height:16px;cursor:pointer}
.barra::before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:4px;background:rgba(255,255,255,.28)}
.barra i{position:relative;display:block;width:0;height:4px;border-radius:4px;background:var(--oro)}
.player-tiempo{font-size:12px;line-height:1;color:#e2d3c8;font-variant-numeric:tabular-nums}

/* Secciones */
.seccion{padding:80px 20px}
.contenedor{max-width:1000px;margin:0 auto}
.titulo-seccion{text-align:center;font-size:clamp(2.3rem,5vw,3.2rem);margin-bottom:40px}

/* Libros */
.libros{display:grid;gap:28px}
.libro{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:36px;align-items:center;padding:24px;background:#fff;border-radius:var(--radio);box-shadow:0 8px 28px rgba(48,36,31,.12)}
.libro img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 6px 18px rgba(48,36,31,.25)}
.libro h3{font-size:clamp(1.9rem,3.5vw,2.4rem);margin-bottom:10px}
.libro p{margin:0 0 16px}
.precio{margin-bottom:20px;font-size:1.5rem;font-weight:900;color:var(--bronce)}
.boton{display:inline-block;padding:14px 28px;background:var(--cafe);color:#fff;font-weight:700;text-decoration:none;border-radius:999px;transition:background .25s}
.boton:hover{background:var(--cafe-2)}

/* Sobre mí */
.sobre{background:var(--cafe);color:var(--crema);text-align:center}
.sobre .titulo-seccion{color:var(--oro)}
.sobre p{max-width:60ch;margin:0 auto 14px;font-size:1.15rem}

/* Redes y contacto */
.redes{background:#fff;text-align:center}
.lista-redes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:0;padding:0;list-style:none}
.contacto{text-align:center}
.contacto p{margin:0 0 20px}
.contacto strong{color:var(--cafe)}
.contacto a{font-weight:700;text-decoration:none}
.contacto a:hover{text-decoration:underline}

footer{padding:28px 20px;background:#211914;color:#d9c8bd;font-size:14px;text-align:center}

@media (max-width:700px){
  .seccion{padding:56px 20px}
  .libro{grid-template-columns:1fr;gap:24px;text-align:center}
  .libro img{max-width:260px;margin:0 auto}
}
@media (max-width:600px){
  .cabecera{padding-top:92px}
  .player{top:14px;right:12px;width:230px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>
</head>
<body>
<main class="seccion sobre" style="min-height:100vh;display:grid;place-content:center">
  <h1 style="color:#fff;font-size:clamp(3rem,10vw,5rem)">404</h1>
  <p>No encontramos esta página.</p>
  <p><a class="boton" href="/" style="background:var(--oro);color:var(--cafe)">Volver al inicio</a></p>
</main>
</body>
</html>
